<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- fundo escuro -->
  <rect width="64" height="64" fill="#0A0F2D"></rect>

  <!-- grid leve -->
  <defs>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0 L0 0 0 8" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"></path>
    </pattern>
  </defs>
  <rect width="64" height="64" fill="url(#grid)"></rect>

  <!-- gradiente neon -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF43EC"></stop>
      <stop offset="100%" stop-color="#3A9BFF"></stop>
    </linearGradient>
  </defs>

  <!-- telhado -->
  <path d="M16 32 L32 16 L48 32" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round"></path>

  <!-- corpo da casinha -->
  <path d="M24 32 V48 H40 V32" fill="none" stroke="url(#g)" stroke-width="4" stroke-linejoin="round"></path>

  <!-- "porta" em <> -->
  <text x="32" y="44" text-anchor="middle" font-family="monospace" font-size="12" fill="url(#g)" font-weight="bold">&lt;&gt;</text>
</svg>
